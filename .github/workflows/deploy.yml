name: Deploy Vite to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # Pobranie repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Instalacja paczek
      - name: Install dependencies
        run: npm ci

      # Build Vite
      - name: Build project
        run: npm run build

      # Deploy do gh-pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Jeśli używasz custom domain → aktywuj:
          # cname: example.com
