<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/ecommerce-product-page-main_TailwindCSS_TypeScript/assets/favicon-32x32-DQjEQYWa.png"
    />

    <title>Frontend Mentor | E-commerce product page</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/ecommerce-product-page-main_TailwindCSS_TypeScript/assets/index-buXTda3H.js"></script>
    <link rel="stylesheet" crossorigin href="/ecommerce-product-page-main_TailwindCSS_TypeScript/assets/index-CcCu7Bn6.css">
  </head>

  <body class="flex h-dvh items-start justify-center">
    <header
      class="fixed top-0 left-0 z-50 flex h-20 w-full items-center justify-center gap-4 bg-white p-4 sm:h-28"
    >
      <div
        id="bg-dark"
        class="absolute inset-0 z-60 hidden h-dvh w-dvw bg-black/75 sm:hidden"
        aria-hidden="true"
      ></div>
      <nav aria-label="Main navigation">
        <button
          type="button"
          id="hamburger-btn"
          aria-label="Toggle navigation menu"
          aria-controls="main-menu"
          aria-expanded="false"
        ></button>
        <div id="logo" role="img" aria-label="Sneaker Company logo"></div>
        <ul id="main-menu" role="menubar"></ul>
        <button id="cart-btn" aria-label="Open shopping cart" type="button">
          <svg
            aria-hidden="true"
            class="h-hull w-full"
            viewBox="0 0 24 24"
            preserveAspectRatio="xMidYMid meet"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M20.925 3.641H3.863L3.61.816A.896.896 0 0 0 2.717 0H.897a.896.896 0 1 0 0 1.792h1l1.031 11.483c.073.828.52 1.726 1.291 2.336C2.83 17.385 4.099 20 6.359 20c1.875 0 3.197-1.87 2.554-3.642h4.905c-.642 1.77.677 3.642 2.555 3.642a2.72 2.72 0 0 0 2.717-2.717 2.72 2.72 0 0 0-2.717-2.717H6.365c-.681 0-1.274-.41-1.53-1.009l14.321-.842a.896.896 0 0 0 .817-.677l1.821-7.283a.897.897 0 0 0-.87-1.114ZM6.358 18.208a.926.926 0 0 1 0-1.85.926.926 0 0 1 0 1.85Zm10.015 0a.926.926 0 0 1 0-1.85.926.926 0 0 1 0 1.85Zm2.021-7.243-13.8.81-.57-6.341h15.753l-1.383 5.53Z"
            />
          </svg>
          <span id="badge"></span>
        </button>
        <div id="avatar" class="transition-300" alt="User profile"></div>
      </nav>
    </header>

    <main
      class="mt-20 flex w-full max-w-5xl flex-col items-center justify-start gap-4 sm:mt-40 sm:flex-row sm:gap-8"
    >
      <section id="gallery" aria-label="Product image gallery">
        <div class="carousel">
          <div
            class="carousel-item main-image"
            id="carousel-main-image"
            role="img"
            aria-label="Main product image"
          ></div>
          <button
            class="carousel-btn carousel-btn-prev"
            value="prev"
            type="button"
            aria-label="Previous image"
          >
            <svg
              class="btn-prev"
              ria-hidden="true"
              width="12"
              height="18"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M11 1 3 9l8 8"
                stroke="currentColor"
                stroke-width="3"
                fill="none"
                fill-rule="evenodd"
              />
            </svg></button
          ><button
            class="carousel-btn carousel-btn-next"
            value="next"
            type="button"
            aria-label="Next image"
          >
            <svg
              class="btn-next"
              ria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="m2 1 8 8-8 8"
                stroke="currentColor"
                stroke-width="3"
                fill="none"
                fill-rule="evenodd"
              />
            </svg>
          </button>
        </div>
        <div
          class="gallery-thumbnails thumbnails"
          aria-label="Image thumbnails"
        ></div>
      </section>
      <section id="offer-card">
        <h2 class="sr-only">Product summary</h2>
        <h1>Sneaker Company</h1>
        <h2 id="product-title"></h2>
        <p>
          These low-profile sneakers are your perfect casual wear companion.
          Featuring a durable rubber outer sole, they’ll withstand everything
          the weather can offer.
        </p>
        <div id="price-tag" aria-label="Product pricing">
          <h3>
            $<span id="product-price"></span>
            <span id="discount" aria-label="50 percent discount">50%</span>
          </h3>
          <p id="original-price" aria-label="Original price">$250.00</p>
        </div>
        <div class="counter-container">
          <div class="counter">
            <button
              type="button"
              id="subtraction"
              class="counter-btn"
              aria-label="Decrease quantity"
            >
              <svg
                aria-hidden="true"
                width="12"
                height="4"
                xmlns="http://www.w3.org/2000/svg"
                xmlns:xlink="http://www.w3.org/1999/xlink"
              >
                <defs>
                  <path
                    d="M11.357 3.332A.641.641 0 0 0 12 2.69V.643A.641.641 0 0 0 11.357 0H.643A.641.641 0 0 0 0 .643v2.046c0 .357.287.643.643.643h10.714Z"
                    id="a"
                  />
                </defs>
                <use fill="current-color" fill-rule="nonzero" xlink:href="#a" />
              </svg>
            </button>
            <span id="counter"></span>
            <button
              type="button"
              id="addition"
              class="counter-btn"
              aria-label="Increase quantity"
            >
              <svg
                aria-hidden="true"
                width="12"
                height="12"
                xmlns="http://www.w3.org/2000/svg"
                xmlns:xlink="http://www.w3.org/1999/xlink"
              >
                <defs>
                  <path
                    d="M12 7.023V4.977a.641.641 0 0 0-.643-.643h-3.69V.643A.641.641 0 0 0 7.022 0H4.977a.641.641 0 0 0-.643.643v3.69H.643A.641.641 0 0 0 0 4.978v2.046c0 .356.287.643.643.643h3.69v3.691c0 .356.288.643.644.643h2.046a.641.641 0 0 0 .643-.643v-3.69h3.691A.641.641 0 0 0 12 7.022Z"
                    id="b"
                  />
                </defs>
                <use fill="current-color" fill-rule="nonzero" xlink:href="#b" />
              </svg>
            </button>
          </div>
          <button
            type="submit"
            aria-label="Add selected items to cart"
            class="transition-300"
          >
            <svg
              aria-hidden="true"
              class="aspect-square h-4.5"
              viewBox="0 0 24 24"
              preserveAspectRatio="xMidYMid meet"
              xmlns="http://www.w3.org/2000/svg"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M20.925 3.641H3.863L3.61.816A.896.896 0 0 0 2.717 0H.897a.896.896 0 1 0 0 1.792h1l1.031 11.483c.073.828.52 1.726 1.291 2.336C2.83 17.385 4.099 20 6.359 20c1.875 0 3.197-1.87 2.554-3.642h4.905c-.642 1.77.677 3.642 2.555 3.642a2.72 2.72 0 0 0 2.717-2.717 2.72 2.72 0 0 0-2.717-2.717H6.365c-.681 0-1.274-.41-1.53-1.009l14.321-.842a.896.896 0 0 0 .817-.677l1.821-7.283a.897.897 0 0 0-.87-1.114ZM6.358 18.208a.926.926 0 0 1 0-1.85.926.926 0 0 1 0 1.85Zm10.015 0a.926.926 0 0 1 0-1.85.926.926 0 0 1 0 1.85Zm2.021-7.243-13.8.81-.57-6.341h15.753l-1.383 5.53Z"
              />
            </svg>
            Add to cart
          </button>
        </div>
      </section>
    </main>
    <aside id="cart" aria-label="Shopping cart">
      <h2>Cart</h2>
      <p id="emptyCart">Your cart is empty.</p>
      <div class="cart-container">
        <div class="cart-item">
          <div
            class="cart-thumbnail"
            role="img"
            aria-label="Product thumbnail"
          ></div>
          <div class="cart-pricetag">
            <p id="cart-product-name"></p>
            <p id="cart-price">
              $<span class="price"></span> x
              <span class="multiply"></span>
              <span class="final-price"></span>
            </p>
          </div>
          <button type="reset" aria-label="Remove item from cart">
            <svg
              aria-hidden="true"
              width="20"
              height="24"
              fill="#C3CAD9"
              fill-rule="nonzero"
              xlink:href="#a"
              xmlns="http://www.w3.org/2000/svg"
              xmlns:xlink="http://www.w3.org/1999/xlink"
            >
              <path
                d="M0 2.625V1.75C0 1.334.334 1 .75 1h3.5l.294-.584A.741.741 0 0 1 5.213 0h3.571a.75.75 0 0 1 .672.416L9.75 1h3.5c.416 0 .75.334.75.75v.875a.376.376 0 0 1-.375.375H.375A.376.376 0 0 1 0 2.625Zm13 1.75V14.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 1 14.5V4.375C1 4.169 1.169 4 1.375 4h11.25c.206 0 .375.169.375.375ZM4.5 6.5c0-.275-.225-.5-.5-.5s-.5.225-.5.5v7c0 .275.225.5.5.5s.5-.225.5-.5v-7Zm3 0c0-.275-.225-.5-.5-.5s-.5.225-.5.5v7c0 .275.225.5.5.5s.5-.225.5-.5v-7Zm3 0c0-.275-.225-.5-.5-.5s-.5.225-.5.5v7c0 .275.225.5.5.5s.5-.225.5-.5v-7Z"
                id="a"
              />
            </svg>
          </button>
        </div>
        <button type="button" id="checkout" class="transition-300">
          Checkout
        </button>
      </div>
    </aside>
    <div
      id="lightbox"
      role="dialog"
      aria-modal="true"
      aria-label="Full screen product gallery"
    >
      <div class="lightbox-container">
        <button
          class="transition-300"
          type="button"
          id="lightbox-close-btn"
          aria-label="Close gallery"
        >
          <svg
            width="14"
            height="15"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path
              d="m11.596.782 2.122 2.122L9.12 7.499l4.597 4.597-2.122 2.122L7 9.62l-4.595 4.597-2.122-2.122L4.878 7.5.282 2.904 2.404.782l4.595 4.596L11.596.782Z"
              fill="current-color"
              fill-rule="evenodd"
            />
          </svg>
        </button>
        <div
          class="lightbox-item main-image"
          id="lightbox-main-image"
          role="img"
          aria-label="Zoomed product image"
        >
          <button
            class="lightbox-btn lightbox-btn-prev"
            value="prev"
            type="button"
            aria-label="Previous image"
          >
            <svg
              class="btn-prev"
              width="12"
              height="18"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M11 1 3 9l8 8"
                stroke="currentColor"
                stroke-width="3"
                fill="none"
                fill-rule="evenodd"
              />
            </svg></button
          ><button
            class="lightbox-btn lightbox-btn-next"
            value="next"
            type="button"
            aria-label="Next image"
          >
            <svg
              class="btn-next"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="m2 1 8 8-8 8"
                stroke="currentColor"
                stroke-width="3"
                fill="none"
                fill-rule="evenodd"
              />
            </svg>
          </button>
        </div>

        <div
          class="lightbox-thumbnails thumbnails"
          aria-label="Lightbox thumbnails"
        ></div>
      </div>
    </div>
  </body>
</html>
